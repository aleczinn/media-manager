appId: local.media-manager-v2
productName: Media Manager
directories:
    buildResources: build
    output: dist
files:
    - out/**/*
    - package.json
extraResources:
    - from: resources/overlays
      to: overlays
asarUnpack:
    - node_modules/mediainfo.js/**
win:
    target: portable
    icon: build/icon.ico
portable:
    artifactName: MediaManager-${version}-portable.exe
